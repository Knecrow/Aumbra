name: aumbra
description: "Aumbra - Awaken your destiny. A Solo Leveling inspired daily quest RPG for self-improvement."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # Local Storage
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # State Management
  provider: ^6.1.2

  # Charts
  fl_chart: ^0.69.0

  # AI
  google_generative_ai: ^0.4.6

  # Utilities
  intl: ^0.19.0
  http: ^1.2.2
  path: ^1.9.0
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.5
  flutter_colorpicker: ^1.1.0

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/quotes.json
    - assets/icon/app_icon.png
